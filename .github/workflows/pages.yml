name: Publish report

on:
  push:
    branches: [main, ass-2-1, ass-2-2]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency: github-pages

jobs:
  publish:
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - uses: actions/checkout@v6

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: renv

      - uses: r-lib/actions/setup-renv@v2

      - name: Check lint and style
        run: Rscript scripts/check.R

      # The report HTML is rendered locally (it needs the downloaded data) and
      # committed; publish it as the site's front page.
      - name: Assemble site
        run: |
          mkdir -p build
          cp report/DV-Assignment2-Part2-GroupX.html build/index.html

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v4
        with:
          path: build

      - name: Publish report
        id: deployment
        uses: actions/deploy-pages@v4