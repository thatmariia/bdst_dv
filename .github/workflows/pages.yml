name: Publish reports

on:
  push:
    branches: [main, ass-2-1, ass-2-2]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency: github-pages

jobs:
  publish:
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - uses: actions/checkout@v6

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: renv

      - uses: quarto-dev/quarto-actions/setup@v2
        with:
          version: 1.10.18

      - uses: r-lib/actions/setup-renv@v2

      - name: Check lint and style
        run: Rscript scripts/check.R

      - name: Render landing page
        run: quarto render index.qmd

      - name: Assemble website
        run: |
          mkdir -p build/report build/downloads
          cp report/*.html build/report/
          cp report/*.Rmd build/downloads/

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v4
        with:
          path: build

      - name: Publish reports
        id: deployment
        uses: actions/deploy-pages@v4