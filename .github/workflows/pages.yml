name: Check and publish reports

on:
  push:
    branches: [main, ass-2-1]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: reports-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: renv
          use-public-rspm: true
      - uses: r-lib/actions/setup-pandoc@v2
      - name: Install XML library for linting
        run: sudo apt-get update && sudo apt-get install -y libxml2-dev
      - uses: r-lib/actions/setup-renv@v2
      - name: Check lint and style
        run: Rscript scripts/check.R
      - name: Check data preparation
        run: Rscript tests/check-data.R
      - name: Knit reports
        run: Rscript scripts/render.R
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    if: >-
      github.event_name != 'pull_request' &&
      (github.ref == 'refs/heads/main' ||
       github.ref == 'refs/heads/ass-2-1')
    needs: build
    runs-on: ubuntu-latest
    concurrency:
      group: github-pages
      cancel-in-progress: false
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - name: Publish reports
        id: deployment
        uses: actions/deploy-pages@v4
